name: Windows (Direct3D 12)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
      - name: Compile
        run: |
            cd paint
            ../base/make --compile

      - name: Upload compiled result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-Direct3D12
          path: |
            paint/build/**
            paint/*.exe
            build/**
          if-no-files-found: error
          retention-days: 30

      - name: Copy compiled result into release folder
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -e

          mkdir -p release

          # Copy the compiled output without changing the build process.
          if [ -d paint/build ]; then
            cp -a paint/build/. release/
          fi

          find paint -maxdepth 1 -type f -name '*.exe' -exec cp -f {} release/ \;

          if [ -d build ]; then
            cp -a build/. release/
          fi

          if [ -z "$(find release -type f -print -quit)" ]; then
            echo "No compiled files were found in the expected output locations."
            echo "Check the compiler output to identify its actual output directory."
            exit 1
          fi

      - name: Commit compiled result to main branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add release/

          if git diff --cached --quiet; then
            echo "No changes to commit in release/."
            exit 0
          fi

          git commit -m "Update compiled ArmorPaint Windows build"
          git push origin HEAD:main
