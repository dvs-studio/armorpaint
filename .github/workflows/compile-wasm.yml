name: WASM (WebGPU)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix missing copysignf declaration
        run: |
          # ArmorPaint's startup.c uses copysignf without including <math.h>
          # under the WASM / miniclib path. Add a quick declaration.
          sed -i '1i\
          #ifndef copysignf\
          float copysignf(float x, float y);\
          #endif' paint/sources/startup.c

      - name: Compile
        run: |
          cd paint
          ../base/make --target wasm --compile --embed

      - name: Upload compiled result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-WASM
          path: |
            paint/build/**
            build/**
          if-no-files-found: error
          retention-days: 30
